version: "3.9"

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: taurus-web
    restart: always
    working_dir: /code/market-analyzer
    command: ["/code/scripts/entrypoint.prod.sh"]
    expose:
      - "8000"
    volumes:
      - static_volume:/code/market-analyzer/frontend_app/staticfiles
    depends_on:
      - db
      - redis
    env_file:
      - .env

  nginx:
    image: nginx:1.27-alpine
    container_name: taurus-nginx
    restart: always
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - static_volume:/staticfiles:ro
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - web

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: taurus-worker
    restart: always
    working_dir: /code/market-analyzer
    command: celery -A webapp worker --loglevel=info
    depends_on:
      - db
      - redis
    env_file:
      - .env

  beat:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: taurus-beat
    restart: always
    working_dir: /code/market-analyzer
    command: celery -A webapp beat --loglevel=info
    depends_on:
      - db
      - redis
    env_file:
      - .env

  db:
    image: postgres:15
    container_name: taurus-database
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: taurus-redis
    restart: always

volumes:
  postgres_data:
  static_volume:
